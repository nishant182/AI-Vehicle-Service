<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Vehicle Service</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-image">
            <div class="auth-overlay">
                <div class="auth-brand">
                    <div class="logo-icon">🚗</div>
                    <span>AI Vehicle Service</span>
                </div>

                <h1>Smart Vehicle Care<br>Starts Here.</h1>

                <p>
                    Manage your vehicle health, maintenance,
                    AI assistance and service bookings from one place.
                </p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-form-section">

            <div class="auth-form">

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

                <h2>Welcome Back</h2>

                <p class="auth-subtitle">
                    Login to your AI Vehicle Service account
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-box">
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                👁
                            </button>
                        </div>
                    </div>

                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit" class="auth-btn">
                        Login
                    </button>

                    <p id="loginMessage" class="login-message"></p>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <p class="register-text">
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
